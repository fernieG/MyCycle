name: MyCycle v4 CI
on:
  push:
    branches:
      - main
      - feat/single-screen-v4
  pull_request:
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run release agents
        run: node tests/run_agents.mjs

      - name: Run real prediction algorithm regression tests (fictional inputs)
        run: node --test tests/prediction-regression.test.mjs
